name: CI

# Só roda para a develop. A main recebe código apenas pela promoção automática,
# cujo PR usa os checks do push na develop (mesmo commit). Assim, nada chega à
# main sem ter passado pela develop.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de teste
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        run: pytest -v

  terraform:
    name: Terraform (fmt e validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"

      - name: Formatação
        run: terraform fmt -check -recursive

      # Sem backend: valida a configuração sem credenciais nem acesso ao state.
      - name: Inicializar
        run: terraform init -backend=false -input=false

      - name: Validar
        run: terraform validate

  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks precisa do histórico para varrer os commits do PR

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
